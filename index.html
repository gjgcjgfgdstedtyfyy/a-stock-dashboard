<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="A股多模式共振选股仪表盘">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b12'/%3E%3Cpath d='M10 42l12-12 9 7 21-23' fill='none' stroke='%2334d399' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <title>A股选股仪表盘</title>
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">MULTI-MODE SIGNAL DESK</p><h1>A股选股仪表盘</h1></div><div class="clock"><span id="market-date">—</span><strong id="session">等待数据</strong></div></header>
  <main>
    <section id="status-banner" class="status-banner status-loading" aria-live="polite"><span class="status-dot"></span><div><strong id="status-title">正在连接选股数据</strong><p id="status-detail">公开版会自动读取最近一次有效筛选结果</p></div></section>
    <section id="market-summary" class="market-grid" aria-label="市场概况"></section>
    <section class="control-strip"><div><span>市场阶段</span><strong id="market-stage">—</strong></div><div><span>总仓位上限</span><strong id="position-limit">—</strong></div><div><span>启用模式</span><strong id="enabled-modes">—</strong></div></section>
    <section class="panel"><div class="panel-head"><h2>全模式覆盖</h2><span>人物、模式、命中与缺口</span></div><div id="mode-coverage" class="mode-coverage"></div></section>
    <section id="resonance-status" class="resonance-status" aria-live="polite">等待多人物共振审计</section>
    <section class="section-head"><div><p class="eyebrow">RANKED CANDIDATES</p><h2>正式候选</h2></div><span id="candidate-count" class="count">0</span></section>
    <section id="candidate-list" class="candidate-list"></section>
    <section class="lower-grid"><article class="panel"><div class="panel-head"><h2>观察池</h2><span>等待条件补全</span></div><div id="watchlist" class="compact-list"></div></article><article class="panel"><div class="panel-head"><h2>淘汰记录</h2><span>本轮不参与</span></div><div id="eliminated" class="compact-list"></div></article></section>
    <section class="panel"><div class="panel-head"><h2>全市场漏选反查</h2><span>强势股必须说明去向</span></div><div id="recall-audit" class="compact-list"></div></section>
    <section class="panel timeline-panel"><div class="panel-head"><h2>当日时间线</h2><span>点击查看历史轮次</span></div><div id="timeline" class="timeline"></div></section>
    <section class="panel"><div class="panel-head"><h2>复盘与风险</h2><span id="data-quality">—</span></div><div id="review" class="review"></div></section>
  </main>
  <footer><span>候选不等于买入</span><span id="last-refresh">尚未刷新</span></footer>
  <script src="./app.js" defer></script>
</body>
</html>
